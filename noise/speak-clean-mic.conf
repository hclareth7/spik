# Speak — "Speak Clean Mic": fuente virtual de micrófono con supresión de ruido RNNoise.
#
# Qué hace:
#   Toma el micrófono físico, le aplica RNNoise (red neuronal de supresión de ruido, ideal
#   para el zumbido constante de un aire acondicionado) y expone el resultado como una FUENTE
#   de audio nueva llamada "Speak Clean Mic". Cualquier app (Chrome, Zoom, Speak) puede
#   elegirla como micrófono y recibirá el audio ya limpio.
#
# Cómo se carga (ver noise/README.md e install.sh):
#   Este es un FRAGMENTO de filter-chain. Se copia/enlaza a:
#       ~/.config/pipewire/filter-chain.conf.d/speak-clean-mic.conf
#   y lo carga la unit de systemd de usuario que ya trae Fedora: `filter-chain.service`.
#   Toggle:  systemctl --user start|stop filter-chain.service
#
# Requisito: el plugin LADSPA `librnnoise_ladspa.so` debe existir en una ruta de LADSPA_PATH.
#   Lo instala noise/build-rnnoise-ladspa.sh en ~/.local/lib/ladspa/ (sin sudo), y
#   install.sh añade un drop-in a la unit para exportar LADSPA_PATH allí.
#
# LADSPA = Linux Audio Developer's Simple Plugin API.  VAD = Voice Activity Detection.

context.modules = [
    { name = libpipewire-module-filter-chain
        flags = [ nofail ]
        args = {
            node.description = "Speak Clean Mic"
            media.name       = "Speak Clean Mic"
            filter.graph = {
                nodes = [
                    {
                        type   = ladspa
                        name   = rnnoise
                        # Sin sufijo .so: se resuelve vía LADSPA_PATH (ver install.sh).
                        plugin = "librnnoise_ladspa"
                        # El micro V8 es estéreo (2ch); por eso el supresor estéreo.
                        label  = noise_suppressor_stereo
                        control = {
                            # Umbral VAD (%). Más alto = más agresivo cortando lo que no es voz.
                            # 50 es un buen punto de partida para ruido de aire acondicionado.
                            "VAD Threshold (%)" 50.0
                        }
                    }
                ]
            }
            audio.position = [ FL FR ]

            capture.props = {
                node.name    = "speak_clean_mic.input"
                node.passive = true
                # Toma directamente el micrófono físico (condensador V8), igual que capture/record.sh.
                # Si cambias de micro, ajusta este nombre (lista: `pactl list sources short`).
                target.object = "alsa_input.usb-SmartlinkTechnology_V8_20121120222017-01.iec958-stereo"
            }

            playback.props = {
                # Este es el nombre de la fuente virtual que verás en Chrome/Zoom/Speak.
                node.name   = "speak_clean_mic"
                media.class = Audio/Source
            }
        }
    }
]
