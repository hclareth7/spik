[project]
name = "spik"
version = "0.2.3"
description = "Coach personal de comunicación a partir de auto-grabaciones (local-first)"
readme = "README.md"
# WhisperX / mediapipe / torch NO soportan Python 3.14 todavia.
# Usa un entorno con Python 3.11 o 3.12 (ver README).
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }

dependencies = [
    # --- Fase 1: transcripcion + feedback (MVP verbal) ---
    "whisperx>=3.1.1",         # STT bilingue con timestamps por palabra (CPU int8 en esta maquina)
    "anthropic[vertex]>=0.40.0",  # Claude via Google Vertex AI (auth por ADC de gcloud)
    "python-dotenv>=1.0.1",    # cargar configuracion desde .env
    "typer>=0.12.0",           # CLI
    "rich>=13.7.0",            # reportes legibles en terminal
]

[project.optional-dependencies]
# --- Fase 2: prosodia (voz) ---
prosody = [
    "praat-parselmouth>=0.4.3",
    "librosa>=0.10.2",
    "numpy>=1.26",
]
# --- Fase 3: vision (gestos, rostro, mirada) ---
vision = [
    "mediapipe>=0.10.14",
    "opencv-python>=4.10",
]
# --- Fase 4: dashboard web local ---
web = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[project.scripts]
spik = "spik.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["spik"]

[tool.ruff]
line-length = 100
target-version = "py311"
